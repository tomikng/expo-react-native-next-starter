version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "deps"
    groups:
      expo:
        patterns: ["expo", "expo-*"]
      react:
        patterns: ["react", "react-*"]
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint", "eslint-*", "@typescript-eslint/*"]
    labels: ["dependencies"]

  - package-ecosystem: "npm"
    directory: "/apps/expo"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "deps"

  - package-ecosystem: "npm"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "deps"

  - package-ecosystem: "npm"
    directory: "/packages/config"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "deps"

  - package-ecosystem: "npm"
    directory: "/packages/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:15"
      timezone: "Europe/Prague"
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "ci"